name: check
# The pack guard on every push and PR. One honest gap, by design: the
# banned-names list is untracked (it names the very clients it protects),
# so that section prints SKIP here and the run reports "no failures, but
# 1 check(s) SKIPPED" — the local pre-commit run is the enforcement point
# for names. Everything else runs at full strength.
on:
  # Manual trigger, added 2026-08-07 after an outage left no move at all:
  # run 31124191160 sat queued 16h ("not acquired by Runner of type
  # hosted"), rerun refused it as already running, cancel refused it as
  # completed, and with only push/pull_request there was no third lever.
  # Runs against a ref's tip, so it re-covers the tree, not a past commit.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No count in this label, deliberately. It read "15 checks" until
      # 2026-08-07, when check.sh was at 29 — a count duplicated outside
      # its single enumeration goes stale, and count-check.sh only reads
      # marked claims in the six docs check.sh passes it, never this file.
      # check.sh's own header enumerates every section; that is the count.
      - name: pack guard (every section, includes positive controls)
        run: bash scripts/check.sh
      - name: guard matrix (every guard shown firing on seeded defects)
        run: bash docs/guard-matrix.sh "$PWD"
      - name: shellcheck
        run: shellcheck -S warning setup scripts/check.sh scripts/controls.sh bin/acstack-config bin/acstack-update-check bin/acstack-recall
