name: check
# The pack guard on every push and PR. One honest gap, by design: the
# banned-names list is untracked (it names the very clients it protects),
# so that section prints SKIP here and the run reports "no failures, but
# 1 check(s) SKIPPED" — the local pre-commit run is the enforcement point
# for names. Everything else runs at full strength.
on:
  # Manual trigger, added 2026-08-07 after an outage left no move at all:
  # run 31124191160 sat queued 16h ("not acquired by Runner of type
  # hosted"), rerun refused it as already running, cancel refused it as
  # completed, and with only push/pull_request there was no third lever.
  # Runs against a ref's tip, so it re-covers the tree, not a past commit.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# 5.26: SHARDS is the divisor and `matrix.shard` is the literal list of
# shard numbers. They are two places that must agree, so check.sh §39
# asserts list length == SHARDS and that the list is exactly 1..N — the
# drift this split would otherwise allow is a shard nobody runs.
env:
  SHARDS: 4

jobs:
  # Everything that runs ONCE per push, not once per shard.
  guard:
    runs-on: ubuntu-latest
    steps:
      # v4 targeted Node 20 and every run carried a deprecation annotation
      # (4.83). Floating major, matching what v4 was. Default fetch-depth is
      # still 1 across v5-v7 — checked, because check.sh §34 SKIPs on a
      # shallow clone by design and a deeper default would silently start
      # running it against the whole history in CI.
      - uses: actions/checkout@v7
      # No count in this label, deliberately. It read "15 checks" until
      # 2026-08-07, when check.sh was at 29 — a count duplicated outside
      # its single enumeration goes stale, and count-check.sh only reads
      # marked claims in the six docs check.sh passes it, never this file.
      # check.sh's own header enumerates every section; that is the count.
      - name: pack guard (every section, includes positive controls)
        run: bash scripts/check.sh
      - name: shellcheck
        # Scope derived, never listed (4.82) — same source check.sh §5 reads.
        run: shellcheck -S warning $(bash scripts/shell-sources.sh)

  # The matrix, partitioned by case ordinal. Wall clock falls ~N-fold for the
  # same runner-minutes; the correctness obligation that buys is exhaustiveness,
  # which is asserted in three independent places: each shard checks its own
  # expected count, check.sh §39 proves the partition covers every case, and
  # `aggregate` below catches a shard that never ran at all.
  matrix:
    runs-on: ubuntu-latest
    strategy:
      # A failing shard must NOT cancel its siblings: their results are the
      # coverage this job exists to report, and losing them to save a minute
      # is the trade backwards.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: guard matrix shard ${{ matrix.shard }} of ${{ env.SHARDS }}
        # 5.20.2: pull requests run with per-case section skipping, the fast
        # form; a push to main or a manual run turns it off, so main is
        # always verified by the whole of check.sh on every case. A skip
        # that hid a failure shows up there right after the merge.
        env:
          ACSTACK_MATRIX_NO_SKIP: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          set -o pipefail
          bash docs/guard-matrix.sh "$PWD" --shard "${{ matrix.shard }}/${{ env.SHARDS }}" | tee shard.log
      - name: record this shard's RAN count
        # Runs even when the shard failed, so `aggregate` can tell "this shard
        # ran and failed" from "this shard never reported".
        if: always()
        run: |
          grep -oE 'RAN=[0-9]+' shard.log | tail -1 | cut -d= -f2 > shard-ran.txt
          cat shard-ran.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shard-ran.txt
          if-no-files-found: error

  # Fan-in, and THE REQUIRED STATUS CHECK. The name `check` is load-bearing:
  # main's branch protection requires a context by that name, and until
  # 2026-09-16 it was satisfied by the single monolithic job. Sharding renamed
  # that job and left no `check` at all, so the first sharded PR reported six
  # green jobs and sat BLOCKED forever — green and unmergeable, with
  # enforce_admins on. Restored here rather than by editing the protection
  # rule: a session that rewrites its own gate has none.
  #
  # It also `needs` BOTH upstream jobs and reads BOTH results. As the only
  # required context it is the single thing main's gate trusts, so anything it
  # does not vouch for is effectively unguarded — a failing `guard` job with a
  # green fan-in would have merged.
  #
  # Artifacts, NOT job outputs: every leg of a matrix writing to `outputs`
  # overwrites the others, last-writer-wins and silently, so a sum built that
  # way would be one shard's count wearing the name of all four.
  check:
    needs: [guard, matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: every shard reported, and their counts sum to the declared set
        run: |
          set -eu
          if [ "${{ needs.guard.result }}" != "success" ]; then
            echo "GUARD FAILED: guard job result is '${{ needs.guard.result }}'."
            echo "  This job is main's only required context, so a green verdict"
            echo "  here over a red check.sh would merge an unguarded tree."
            exit 1
          fi
          if [ "${{ needs.matrix.result }}" != "success" ]; then
            echo "SHARDS FAILED: matrix job result is '${{ needs.matrix.result }}'."
            echo "  A green fan-in over a red shard is the false pass this"
            echo "  step exists to refuse. See the failing shard's log."
            exit 1
          fi
          declared="$(grep -cE '^([a-z]+case|check) ' docs/guard-matrix.sh)"
          reported=0; total=0
          for i in $(seq 1 "$SHARDS"); do
            f="shards/shard-$i/shard-ran.txt"
            if [ ! -s "$f" ]; then
              echo "SHARD $i REPORTED NOTHING: $f missing or empty."
              echo "  A shard that never ran leaves every other shard green and"
              echo "  the aggregate clean — invisible by construction, which is"
              echo "  why this is asserted rather than assumed."
              exit 1
            fi
            n="$(cat "$f")"; reported=$((reported + 1)); total=$((total + n))
            echo "  shard $i/$SHARDS ran $n case(s)"
          done
          echo "shards reporting: $reported/$SHARDS   cases run: $total   declared: $declared"
          if [ "$reported" -ne "$SHARDS" ] || [ "$total" -ne "$declared" ]; then
            echo "MATRIX INCOMPLETE ACROSS SHARDS: $total of $declared case(s) ran."
            exit 1
          fi
          echo "every declared case ran exactly once across $SHARDS shard(s)"
        env:
          SHARDS: ${{ env.SHARDS }}
